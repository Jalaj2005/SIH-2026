services:
  dashboard-backend:
    build: ./backend
    container_name: soc-dashboard-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    restart: unless-stopped

  dashboard-frontend:
    build: ./frontend
    container_name: soc-dashboard-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - dashboard-backend
    restart: unless-stopped
